<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="ياللي - لعبة جماعية شبابية. مين فيكم...؟" />
  <meta name="theme-color" content="#0F0F1E" />
  <title>ياللي | لعبة الشلة</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet" />

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/style.css" />

  <!-- Boot loader (inline علشان يبان قبل أي خط أو CDN) -->
  <style>
    body { background: #0F0F1E; }
    #boot-loader {
      position: fixed; inset: 0; z-index: 9999;
      background: linear-gradient(135deg, #0F0F1E 0%, #1A1A2E 100%);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      transition: opacity 0.4s ease;
      font-family: 'Tajawal', system-ui, sans-serif;
    }
    #boot-loader .boot-logo {
      font-size: 4.5rem; font-weight: 900; line-height: 1;
      background: linear-gradient(135deg, #FFD700 0%, #FFA500 50%, #E94560 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 2rem;
      filter: drop-shadow(0 0 30px rgba(255, 215, 0, 0.5));
    }
    #boot-loader .boot-spinner {
      width: 36px; height: 36px;
      border: 3px solid rgba(255, 215, 0, 0.2);
      border-top-color: #FFD700;
      border-radius: 50%;
      animation: bl-spin 0.8s linear infinite;
    }
    #boot-loader .boot-text {
      margin-top: 1.25rem;
      color: #8B8B9F;
      font-weight: 700;
      font-size: 0.95rem;
    }
    @keyframes bl-spin { to { transform: rotate(360deg); } }
  </style>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'bg-deep': '#0F0F1E',
            'bg-mid': '#1A1A2E',
            'gold':   '#FFD700',
            'red-warm': '#E94560',
            'success': '#00D9A3',
            'muted':  '#8B8B9F',
          }
        }
      }
    }
  </script>
</head>
<body class="bg-stage">
  <!-- Boot loader -->
  <div id="boot-loader">
    <div class="boot-logo">ياللي</div>
    <div class="boot-spinner"></div>
    <p class="boot-text">يحمّل...</p>
  </div>

  <div class="stars"></div>

  <main class="relative z-10 min-h-screen flex flex-col items-center justify-center px-4 py-8">

    <!-- Logo -->
    <div class="text-center mb-8 fade-in">
      <h1 class="logo-yalli">ياللي</h1>
      <p class="mt-2 text-lg sm:text-2xl text-muted font-bold tracking-wide">
        مين فيكم...؟ &nbsp;·&nbsp; ساحة المرجلة
      </p>
    </div>

    <!-- Card with two main actions -->
    <div class="glass w-full max-w-md p-6 sm:p-8 card-pop">
      <div id="home-screen" class="space-y-4">
        <button id="btn-create" class="btn-neon btn-wobble w-full">
          <span>أنشئ غرفة</span>
        </button>

        <div class="flex items-center gap-3 my-4">
          <div class="flex-1 h-px bg-gold/20"></div>
          <span class="text-muted text-sm font-bold">أو</span>
          <div class="flex-1 h-px bg-gold/20"></div>
        </div>

        <button id="btn-join-toggle" class="btn-neon btn-neon-red btn-wobble w-full">
          <span>دخول لغرفة</span>
        </button>
      </div>

      <!-- Join form -->
      <div id="join-screen" class="space-y-4 hidden">
        <h2 class="text-2xl font-black text-center neon-gold">دخول لغرفة</h2>

        <div>
          <label class="block text-sm font-bold mb-2 text-muted">كود الغرفة</label>
          <input
            id="input-code"
            type="text"
            maxlength="6"
            placeholder="ABC123"
            class="input-glow text-center tracking-[0.3em] font-en uppercase"
            autocomplete="off"
            inputmode="latin"
          />
        </div>

        <div>
          <label class="block text-sm font-bold mb-2 text-muted">اسمك</label>
          <input
            id="input-name"
            type="text"
            maxlength="14"
            placeholder="مثلاً: أبو فهد"
            class="input-glow text-center"
            autocomplete="off"
          />
        </div>

        <button id="btn-join-go" class="btn-neon w-full">
          <span>ادخل</span>
        </button>

        <button id="btn-join-back" class="btn-ghost w-full">
          <span>رجوع</span>
        </button>
      </div>
    </div>

    <!-- Footer -->
    <footer class="mt-10 text-center text-muted text-sm">
      <p>صُنعت لشلة المحترش</p>
    </footer>
  </main>

  <!-- Toasts container -->
  <div id="toast-host"></div>

  <script type="module" src="js/game-logic.js"></script>
  <script type="module">
    import {
      generateRoomCode, normalizeCode, showToast,
      hideBootLoader, showPageTransition,
    } from './js/game-logic.js';

    const $ = (id) => document.getElementById(id);

    // أخفِ شاشة التحميل لما الصفحة تجهز
    hideBootLoader();

    const homeScreen = $('home-screen');
    const joinScreen = $('join-screen');
    const inputCode  = $('input-code');
    const inputName  = $('input-name');

    // إذا الرابط فيه ?room=XXXXXX → فتحته الناس من واتساب
    // نوديهم على شاشة الدخول مع الكود معبّى، وفقط يكتبون الاسم
    const urlParams = new URLSearchParams(window.location.search);
    const roomFromUrl = urlParams.get('room');
    if (roomFromUrl && /^[A-Z0-9]{6}$/i.test(roomFromUrl)) {
      inputCode.value = roomFromUrl.toUpperCase();
      homeScreen.classList.add('hidden');
      joinScreen.classList.remove('hidden');
      joinScreen.classList.add('card-pop');
      // ركّز على الاسم مباشرة (الكود جاهز)
      setTimeout(() => inputName.focus(), 100);
    }

    $('btn-join-toggle').addEventListener('click', () => {
      homeScreen.classList.add('hidden');
      joinScreen.classList.remove('hidden');
      joinScreen.classList.add('card-pop');
      inputCode.focus();
    });

    $('btn-join-back').addEventListener('click', () => {
      joinScreen.classList.add('hidden');
      homeScreen.classList.remove('hidden');
    });

    $('btn-create').addEventListener('click', () => {
      const code = generateRoomCode();
      showPageTransition('يجهّز الغرفة...');
      window.location.href = `host.html?room=${code}`;
    });

    $('btn-join-go').addEventListener('click', joinRoom);
    inputCode.addEventListener('keyup', (e) => { if (e.key === 'Enter') inputName.focus(); });
    inputName.addEventListener('keyup', (e) => { if (e.key === 'Enter') joinRoom(); });

    inputCode.addEventListener('input', (e) => {
      e.target.value = e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, '');
    });

    function joinRoom() {
      const code = normalizeCode(inputCode.value);
      const name = inputName.value.trim();

      if (code.length !== 6) {
        showToast('الكود لازم يكون ٦ أحرف يا شيخ', 'error');
        inputCode.focus();
        return;
      }
      if (name.length < 2) {
        showToast('اكتب اسمك علشان نعرفك', 'error');
        inputName.focus();
        return;
      }

      const params = new URLSearchParams({ room: code, name });
      showPageTransition('يدخل الغرفة...');
      window.location.href = `player.html?${params.toString()}`;
    }
  </script>
</body>
</html>
